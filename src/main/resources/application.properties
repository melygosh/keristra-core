spring.application.name=keristra-core

# Secrets come from environment variables, or from a git-ignored
# ./application-local.properties (see application-local.properties.example).
spring.config.import=optional:file:./application-local.properties

openai.model=ft:gpt-3.5-turbo-0125:personal::9XowJ12Q
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.key=${OPENAI_API_KEY:}

anthropic.api.key=${ANTHROPIC_API_KEY:}
voyage.api.key=${VOYAGE_API_KEY:}
logging.level.com.grimels=INFO

logging.file.path=./logs

# LLM providers for the experiment harness. A run picks "<provider>:<model>", e.g.
# "anthropic:claude-sonnet-4-20250514" or "local:gpt-oss:20b".
keristra.llm.providers.anthropic.type=anthropic
keristra.llm.providers.anthropic.api-key=${anthropic.api.key}
# Ollama by default; LM Studio is http://localhost:1234/v1. Point at the 4070 Ti box via LOCAL_LLM_BASE_URL.
keristra.llm.providers.local.type=openai-compatible
keristra.llm.providers.local.base-url=${LOCAL_LLM_BASE_URL:http://localhost:11434/v1}
keristra.llm.providers.local.timeout=15m

# Cost estimates in the experiment log: USD per million tokens. Anthropic list prices as of 2026-10-06;
# models without a price get costUsd=null. Providers listed as free (local models) cost 0.
keristra.pricing.free-providers=local
keristra.pricing.models[claude-sonnet-5-5].input-per-mtok=2.0
keristra.pricing.models[claude-sonnet-5-5].output-per-mtok=10.0
keristra.pricing.models[claude-sonnet-5].input-per-mtok=2.0
keristra.pricing.models[claude-sonnet-5].output-per-mtok=10.0
keristra.pricing.models[claude-opus-5-5].input-per-mtok=4.0
keristra.pricing.models[claude-opus-5-5].output-per-mtok=20.0
keristra.pricing.models[claude-haiku-5-5].input-per-mtok=0.10
keristra.pricing.models[claude-haiku-5-5].output-per-mtok=0.50
keristra.pricing.models[claude-sonnet-4-6].input-per-mtok=3.0
keristra.pricing.models[claude-sonnet-4-6].output-per-mtok=15.0
