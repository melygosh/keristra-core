spring.application.name=keristra-core

# Secrets come from environment variables, or from a git-ignored
# ./application-local.properties (see application-local.properties.example).
spring.config.import=optional:file:./application-local.properties

openai.model=ft:gpt-3.5-turbo-0125:personal::9XowJ12Q
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.key=${OPENAI_API_KEY:}

anthropic.api.key=${ANTHROPIC_API_KEY:}
voyage.api.key=${VOYAGE_API_KEY:}
logging.level.com.grimels=INFO

logging.file.path=./logs
