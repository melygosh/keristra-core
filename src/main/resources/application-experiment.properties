# Experiment runner profile: no web server; see ExperimentCommand.
spring.main.web-application-type=none
keristra.experiment.output-dir=runs
# Generated and reference tables use typeRef="number", which Camunda 7 does not know (DMN-01006, harmless):
# one warning per numeric input per parsed table would bury the run log.
logging.level.org.camunda.bpm.dmn=ERROR
